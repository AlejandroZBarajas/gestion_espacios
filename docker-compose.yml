services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # No expone puertos al exterior: solo nginx puede hablarle
    expose:
      - "80"
    networks:
      - app-network
    restart: always

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Config del reverse proxy
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados autofirmados (generados con generate-certs.sh)
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - app-network
    depends_on:
      - frontend
    restart: always

networks:
  app-network:
    driver: bridge